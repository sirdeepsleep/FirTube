name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Library
        run: |
          cd app/src/main/rust
          export RUSTFLAGS="-C strip=symbols -C codegen-units=1 --remap-path-prefix=$(pwd)=/build"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
          
          mkdir -p ../jniLibs/arm64-v8a ../jniLibs/armeabi-v7a ../jniLibs/x86_64
          cp target/aarch64-linux-android/release/libargon_security.so ../jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libargon_security.so ../jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libargon_security.so ../jniLibs/x86_64/

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
